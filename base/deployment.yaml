apiVersion: apps/v1

kind: Deployment

metadata:

  name: meditriage-backend

  labels:

    app: meditriage-backend

    iniciativa: meditriage

spec:



  selector:

    matchLabels:

      app: meditriage-backend

  template:

    metadata:

      labels:

        app: meditriage-backend

    spec:

      containers:

        - name: backend

         

          image: ghcr.io/ginalef-ui/meditriage-backend

          imagePullPolicy: IfNotPresent

          ports:

            - containerPort: 3000

              name: http

          resources:

            requests:

              cpu: "200m"

              memory: "256Mi"

            limits:

              cpu: "1000m"

              memory: "512Mi"

          envFrom:

            - configMapRef:

                name: meditriage-config

            - secretRef:

                name: meditriage-secrets

          readinessProbe:

            tcpSocket:

              port: 3000

            initialDelaySeconds: 5

            periodSeconds: 10

          livenessProbe:

            tcpSocket:

              port: 3000

            initialDelaySeconds: 15

            periodSeconds: 20
