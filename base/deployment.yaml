
apiVersion: apps/v1
kind: Deployment
metadata:
  name: meditriage-backend
  labels:
    app: meditriage-backend
    iniciativa: meditriage
spec:
  replicas: 2
  selector:
    matchLabels:
      app: meditriage-backend
  template:
    metadata:
      labels:
        app: meditriage-backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/ginalef-ui/meditriage-backend:latest
          ports:
            - containerPort: 3000
              name: http
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
