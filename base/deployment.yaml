apiVersion: apps/v1
kind: Deployment
metadata:
  name: meditriage-backend
  labels:
    app: meditriage-backend
    iniciativa: meditriage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: meditriage-backend
  template:
    metadata:
      labels:
        app: meditriage-backend
    spec:
      containers:
        - name: backend
          image: nginx:alpine
          ports:
            - containerPort: 3000
              name: http
