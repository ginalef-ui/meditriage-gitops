
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: meditriage-prod

resources:
  - ../../base
  - namespace.yaml

labels:
  - pairs:
      environment: prod
    includeSelectors: false

patches:
  - target:
      group: autoscaling
      version: v2
      kind: HorizontalPodAutoscaler
      name: meditriage-backend-hpa
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 2
      - op: replace
        path: /spec/maxReplicas
        value: 5
