apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: meditriage-prod

resources:
  - ../../base
  - namespace.yaml

labels:
  - pairs:
      environment: prod
    includeSelectors: false

images:
  - name: ghcr.io/ginalef-ui/meditriage-backend
    newName: nginx
    newTag: alpine
