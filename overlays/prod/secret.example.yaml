# EJEMPLO, NO está en resources. No pongas valores reales aquí.
# Opciones para prod: Sealed Secrets (SealedSecret cifrado, sí se puede versionar),
# External Secrets Operator, o crearlo a mano con:
#   kubectl -n meditriage-prod create secret generic meditriage-secrets \
#     --from-literal=POSTGRES_USER=... --from-literal=POSTGRES_PASSWORD=...
apiVersion: v1
kind: Secret
metadata:
  name: meditriage-secrets
type: Opaque
stringData:
  POSTGRES_USER: "<definir-fuera-de-git>"
  POSTGRES_PASSWORD: "<definir-fuera-de-git>"
