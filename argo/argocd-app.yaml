apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: meditriage-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/ginalef-ui/meditriage-gitops.git'
    targetRevision: HEAD
    path: overlays/prod
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: meditriage-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
